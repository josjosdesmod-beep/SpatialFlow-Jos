name: Build Debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode and write signing keystore
        run: |
          mkdir -p $HOME/keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $HOME/keystores/spatialflow.p12
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Set keystore env vars
        run: |
          echo "ANDROID_KEYSTORE_PATH=$HOME/keystores/spatialflow.p12" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS_PASSWORD=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}" >> $GITHUB_ENV

      - name: Accept Android SDK & NDK licenses
        run: |
          set +o pipefail
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          set -o pipefail

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APKs
        run: ./gradlew assembleDebug --no-daemon --parallel

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: spatialflow-debug-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
          
